<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quantity Measurement</title>
    <link rel="icon" type="image/png" href="../images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <script>
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        if (!currentUser) {
            window.location.href = 'index.html';
        }
    </script>

    <header class="header">
        <div class="header-brand">
            <img src="../images/favicon.png" alt="Logo" class="header-logo">
            <h1>
                <span class="full-title">Quantity Measurement</span>
                <span class="short-title">QM App</span>
            </h1>
        </div>
        <nav class="nav" id="authNav">
            <span class="nav-user" id="userName">User</span>
            <a href="#" class="nav-link" onclick="logout()">
                <span class="logout-text">Logout</span>
                <span class="logout-icon">Exit</span>
            </a>
        </nav>
    </header>

    <main class="main-content">
        <section class="dashboard-hero">
            <div class="hero-grid">
                <div class="hero-content">
                    <h2>Quantity Measurement</h2>
                </div>
            </div>
        </section>

        <div class="workspace-grid">
            <div class="workspace-main">
                <section class="section">
                    <div class="section-header">
                        <div>
                            <h2 class="section-title">Choose Type</h2>
                        </div>
                    </div>

                    <div class="type-cards">
                        <div class="type-card" data-type="Length">
                            <div class="type-card-head">
                                <span class="type-icon">LEN</span>
                            </div>
                            <span class="type-label">Length</span>
                        </div>
                        <div class="type-card" data-type="Weight">
                            <div class="type-card-head">
                                <span class="type-icon">WGT</span>
                            </div>
                            <span class="type-label">Weight</span>
                        </div>
                        <div class="type-card" data-type="Temperature">
                            <div class="type-card-head">
                                <span class="type-icon">TMP</span>
                            </div>
                            <span class="type-label">Temperature</span>
                        </div>
                        <div class="type-card" data-type="Volume">
                            <div class="type-card-head">
                                <span class="type-icon">VOL</span>
                            </div>
                            <span class="type-label">Volume</span>
                        </div>
                    </div>
                </section>

                <section class="section">
                    <div class="section-header">
                        <div>
                            <h2 class="section-title">Choose Action</h2>
                        </div>
                    </div>

                    <div class="action-tabs">
                        <button class="action-tab" data-action="comparison">Comparison</button>
                        <button class="action-tab active" data-action="conversion">Conversion</button>
                        <button class="action-tab" data-action="arithmetic">Arithmetic</button>
                    </div>
                </section>

                <section class="section input-section" id="conversionSection">
                    <div class="section-header">
                        <div>
                            <h2 class="section-title">Conversion</h2>
                        </div>
                    </div>

                    <div class="input-row">
                        <div class="input-box">
                            <label class="input-label">From</label>
                            <input type="number" class="value-input" id="fromValue" placeholder="Enter value" step="any">
                            <select class="unit-select" id="fromUnit" disabled>
                                <option value="">Select Unit</option>
                            </select>
                        </div>
                        <div class="input-box">
                            <label class="input-label">To</label>
                            <input type="number" class="value-input" id="toValue" placeholder="Result" readonly>
                            <select class="unit-select" id="toUnit" disabled>
                                <option value="">Select Unit</option>
                            </select>
                        </div>
                    </div>
                    <button class="convert-btn" id="convertBtn">Convert</button>
                </section>

                <section class="section input-section hidden" id="comparisonSection">
                    <div class="section-header">
                        <div>
                            <h2 class="section-title">Comparison</h2>
                        </div>
                    </div>

                    <div class="input-row">
                        <div class="input-box">
                            <label class="input-label">Value 1</label>
                            <input type="number" class="value-input" id="compareValue1" placeholder="Enter value" step="any">
                            <select class="unit-select" id="compareUnit1" disabled>
                                <option value="">Select Unit</option>
                            </select>
                        </div>
                        <div class="input-box">
                            <label class="input-label">Value 2</label>
                            <input type="number" class="value-input" id="compareValue2" placeholder="Enter value" step="any">
                            <select class="unit-select" id="compareUnit2" disabled>
                                <option value="">Select Unit</option>
                            </select>
                        </div>
                    </div>
                    <button class="convert-btn" id="compareBtn">Compare</button>
                    <div class="result-row" id="comparisonResult" style="display: none;">
                        <div class="result-box">
                            <span class="result-value" id="compareResultText">-</span>
                        </div>
                    </div>
                </section>

                <section class="section input-section hidden" id="arithmeticSection">
                    <div class="section-header">
                        <div>
                            <h2 class="section-title">Arithmetic</h2>
                        </div>
                    </div>

                    <div class="input-row arithmetic-row">
                        <div class="input-box">
                            <label class="input-label">Value 1</label>
                            <input type="number" class="value-input" id="value1" placeholder="0" step="any">
                            <select class="unit-select" id="unit1" disabled>
                                <option value="">Select Unit</option>
                            </select>
                        </div>
                        <div class="operator-box">
                            <select class="operator-select" id="operator">
                                <option value="add">+</option>
                                <option value="subtract">-</option>
                                <option value="divide">/</option>
                            </select>
                        </div>
                        <div class="input-box">
                            <label class="input-label">Value 2</label>
                            <input type="number" class="value-input" id="value2" placeholder="0" step="any">
                            <select class="unit-select" id="unit2" disabled>
                                <option value="">Select Unit</option>
                            </select>
                        </div>
                    </div>
                    <button class="convert-btn" id="arithmeticBtn">Calculate</button>

                    <div class="result-row" id="arithmeticResult">
                        <div class="result-box">
                            <label class="input-label">Result</label>
                            <span class="result-value" id="resultValue">0</span>
                            <select class="unit-select" id="resultUnit" disabled>
                                <option value="">Unit</option>
                            </select>
                        </div>
                    </div>
                </section>
            </div>

        </div>
    </main>

    <script src="../js/script.js"></script>
</body>
</html>
